<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="1180" height="520" role="img" aria-label="A Slack user runs /newintro and submits the modal to the UI Lambda, which checks the email allowlist, acknowledges Slack and invokes the worker Lambda asynchronously. Both read their config from Secrets Manager. The worker syncs the Azure AD group, picks partners from DynamoDB, books slots in Google Calendar and posts progress to the Slack channel."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b7684"/></marker></defs><rect x="440" y="40" width="280" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(456.0,53.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M12 12h9 M18 12v3 M15 12v2"/></g><text x="487.0" y="68.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Secrets Manager</text><text x="456.0" y="92.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">one JSON config secret</text><polyline points="470,112 470,142" fill="none" stroke="#6b7684" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><polyline points="690,112 690,142" fill="none" stroke="#6b7684" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="24" y="150" width="170" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(40.0,163.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="71.0" y="178.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Slack user</text><text x="40.0" y="202.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">fills in the modal</text><text x="40.0" y="220.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">and submits it</text><rect x="290" y="150" width="230" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(306.0,163.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></g><text x="337.0" y="178.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">UI Lambda</text><text x="306.0" y="202.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">checks the email allowlist,</text><text x="306.0" y="220.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">acks Slack within 3 s</text><rect x="652" y="150" width="240" height="84" rx="10" fill="#4c7ef3" stroke="#4c7ef3" stroke-width="1"/><g transform="translate(668.0,163.0) scale(0.8750)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></g><text x="699.0" y="178.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="start" font-weight="600">Worker Lambda</text><text x="668.0" y="202.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">books every intro, stops</text><text x="668.0" y="220.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">safely near 15 minutes</text><polyline points="202,192.0 282,192.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="242.0" y="183.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">/newintro</text><polyline points="528,192.0 644,192.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="586.0" y="183.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">async invoke</text><polyline points="772.0,242 772.0,290 390,290 390,322" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><rect x="290" y="330" width="200" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(306.0,343.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6 M16 4.3a3.5 3.5 0 0 1 0 6.4 M18 14.2c2.1.7 3.5 2.8 3.5 5.8"/></g><text x="337.0" y="358.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Azure AD</text><text x="306.0" y="382.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">group members in,</text><text x="306.0" y="400.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">departed pruned</text><polyline points="772.0,242 772.0,290 612,290 612,322" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><rect x="512" y="330" width="200" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(528.0,343.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3z M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6 M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g><text x="559.0" y="358.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">DynamoDB</text><text x="528.0" y="382.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">partner weights,</text><text x="528.0" y="400.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">least-used first</text><polyline points="772.0,242 772.0,290 834,290 834,322" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><rect x="734" y="330" width="200" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(750.0,343.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v15H4z M4 10h16 M8 3v5 M16 3v5 M8 14h2 M14 14h2 M8 17.5h2"/></g><text x="781.0" y="358.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Google Calendar</text><text x="750.0" y="382.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">FreeBusy search,</text><text x="750.0" y="400.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">event with both people</text><polyline points="772.0,242 772.0,290 1056,290 1056,322" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><rect x="956" y="330" width="200" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(972.0,343.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z M8 9h8 M8 12h5"/></g><text x="1003.0" y="358.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Slack channel</text><text x="972.0" y="382.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">progress and</text><text x="972.0" y="400.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">confirmations</text><line x1="24" y1="468" x2="1156" y2="468" stroke="#232a33" stroke-width="1"/><text x="24.0" y="494.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">The UI Lambda answers inside Slack's three-second window and hands the whole request over; the worker syncs the group once, then books intro by intro.</text></svg>