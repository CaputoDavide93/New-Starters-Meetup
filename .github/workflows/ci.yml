name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Ruff lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt && pip install boto3 pytest ruff
      - name: Lint
        run: ruff check --select E4,E7,E9,F src scripts tests
      - name: Test
        run: python -m pytest tests
